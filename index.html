<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#231a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Chairlift Climb: a single-screen climbing platformer. Jump the rolling sap barrels and reach the summit lodge before the lift closes.">
<title>Chairlift Climb</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1794270003">
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <!-- touch controls: left thumb pad, right thumb jump. The whole strip is the touch zone. -->
  <div id="ctl" aria-hidden="true">
    <div id="pad">
      <div class="arm u"><svg viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M7 3v18M17 3v18"/></svg><b>&#9650;</b></div>
      <div class="arm l"><b>&#9664;</b></div>
      <div class="arm r"><b>&#9654;</b></div>
      <div class="arm d"><b>&#9660;</b></div>
      <div class="hub"></div>
    </div>
    <div id="jump"><span>JUMP</span></div>
  </div>

  <button id="pauseBtn" class="ui" aria-label="Pause" hidden><i></i><i></i></button>

  <section id="title" class="screen ui">
    <div class="logo">
      <span class="l1">CHAIRLIFT</span>
      <span class="l2">CLIMB</span>
    </div>
    <div class="tag">a single-screen barrel-jumping climbing platformer</div>
    <div class="grow"></div>
    <div class="panel">
      <div class="best" id="bestLine"></div>
      <button id="btnPlay" class="big">PLAY</button>
      <button id="btnDaily" class="daily"><span class="dl1">DAILY CLIMB</span><span class="dl2" id="dailyLine"></span></button>
      <div class="stagepick" id="stagePick"></div>
      <div class="stageinfo" id="stageInfo"></div>
      <div class="toggles" id="togglesTitle"></div>
      <div class="how" id="howLine">Jump the sap barrels &middot; climb to the summit lodge before the lift closes</div>
    </div>
  </section>

  <section id="pause" class="screen ui" hidden>
    <div class="card">
      <h2>PAUSED</h2>
      <button id="btnResume" class="big">RESUME</button>
      <div class="row">
        <button id="btnRestart" class="mid">Restart</button>
        <button id="btnQuit" class="mid">Menu</button>
      </div>
      <div class="toggles" id="togglesPause"></div>
    </div>
  </section>

  <section id="over" class="screen ui" hidden>
    <div class="card">
      <canvas id="ovMoose"></canvas>
      <h2 id="ovHead">LIFT CLOSED</h2>
      <div class="sub" id="ovSub"></div>
      <div class="finalscore" id="ovScore">0</div>
      <div class="newbest" id="ovBest"></div>
      <div class="stats" id="ovStats"></div>
      <div class="ovbreak" id="ovBreak"></div>
      <div class="ovextra" id="ovExtra"></div>
      <button id="btnAgain" class="big">CLIMB AGAIN</button>
      <div class="row"><button id="btnShare" class="mid" hidden>Copy result</button><button id="btnMenu" class="mid">Menu</button></div>
    </div>
  </section>
</div>
<div id="probe"></div>
<script src="stages.js?v=1794270003"></script>
<script src="art.js?v=1794270003"></script>
<script src="audio.js?v=1794270003"></script>
<script src="game.js?v=1794270003"></script>
</body>
</html>
